name: Test E2E (Envtest)

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  test-e2e-envtest:
    name: Run E2E Tests (Envtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Running E2E Envtest Tests
        run: |
          go mod download
          make test-e2e-envtest
