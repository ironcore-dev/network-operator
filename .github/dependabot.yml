# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules — root module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      onsi-minor-and-patch:
        patterns:
          - "github.com/onsi/*"
        update-types:
          - "minor"
          - "patch"
      json-minor-and-patch:
        patterns:
          - "github.com/tidwall/*"
        update-types:
          - "minor"
          - "patch"
      openconfig-minor-and-patch:
        patterns:
          - "github.com/openconfig/*"
        update-types:
          - "minor"
          - "patch"
      aws-minor-and-patch:
        patterns:
          - "github.com/aws/*"
        update-types:
          - "minor"
          - "patch"
      golang-minor-and-patch:
        patterns:
          - "google.golang.org/*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Ignore k8s.io/* and controller-runtime dependencies, as they are bumped together manually.
      - dependency-name: "k8s.io/*"
      - dependency-name: "sigs.k8s.io/controller-runtime"

  # Docker — root Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"

  # Docker — docs Dockerfile
  - package-ecosystem: "docker"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "friday"

  # Docker — test/gnmi Dockerfile
  - package-ecosystem: "docker"
    directory: "/test/gnmi"
    schedule:
      interval: "weekly"
      day: "friday"

  # Docker — test/lab Dockerfile
  - package-ecosystem: "docker"
    directory: "/test/lab"
    schedule:
      interval: "weekly"
      day: "friday"

  # npm — docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      docs-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Helm — network-operator chart
  - package-ecosystem: "helm"
    directory: "/charts/network-operator"
    schedule:
      interval: "weekly"
      day: "friday"

  # GitHub Actions — keep workflow references SHA-pinned with inline version comments.
  # Dependabot preserves the SHA pins and updates the version comments in its PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    groups:
      gha-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
