# RustFS — S3-compatible object storage for local development.
# Provides a web console on port 9001 for browsing uploaded backups.
# Access the console via: kubectl port-forward svc/rustfs 9001:9001
#
# RustFS is used for local development only and is not distributed as part of this project.
# RustFS is licensed under Apache-2.0: https://github.com/rustfs/rustfs/blob/main/LICENSE
#
# Default credentials: rustfsadmin / rustfsadmin
# S3 endpoint from within the cluster: http://rustfs.default.svc:9000
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials
  namespace: default
type: Opaque
stringData:
  accessKeyID: rustfsadmin
  secretAccessKey: rustfsadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          env:
            - name: RUSTFS_ROOT_USER
              value: "rustfsadmin"
            - name: RUSTFS_ROOT_PASSWORD
              value: "rustfsadmin"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Create default buckets after RustFS is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-buckets
  namespace: default
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: rustfs/rc:latest
          command: ["sh", "-c"]
          args:
            - |
              rc alias set local http://rustfs.default.svc.cluster.local:9000 rustfsadmin rustfsadmin
              rc bucket create --ignore-existing local/config-backups
