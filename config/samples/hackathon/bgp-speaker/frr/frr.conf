frr version 10.7
frr defaults traditional
hostname bgp-speaker
log stdout
no ipv6 forwarding
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy            ! allow routes without route-maps (lab use)
 !
 ! --- Static neighbor (as requested) ----------------------------------------
 ! Replace with your real peer. NOTE: when the peer connects THROUGH
 ! host.docker.internal, FRR sees a NAT'd source IP (the Docker gateway),
 ! which usually will not match this address. If the session stays in
 ! Active/Connect, read the observed address from `show bgp neighbors` and
 ! set it here, or switch to the dynamic-neighbor block below.
 neighbor 198.51.100.2 remote-as 65001
 neighbor 198.51.100.2 description peer-container
 !
 ! --- Dynamic neighbors (recommended for the host.docker.internal topology) -
 ! Accepts the peer regardless of its (NAT'd) source IP. To use: comment out
 ! the two static `neighbor 198.51.100.2 ...` lines above, uncomment these,
 ! and activate PEERS in the address-family below instead of 198.51.100.2.
 ! neighbor PEERS peer-group
 ! neighbor PEERS remote-as external
 ! bgp listen range 0.0.0.0/0 peer-group PEERS
 !
 address-family ipv4 unicast
  neighbor 198.51.100.2 activate
  ! neighbor PEERS activate
  network 203.0.113.0/24                ! example prefix we advertise
 exit-address-family
!
line vty
!
