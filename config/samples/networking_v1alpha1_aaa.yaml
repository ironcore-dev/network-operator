# Example AAA configuration with TACACS+ servers
# This configures:
# - feature tacacs+
# - tacacs-server hosts with encrypted keys
# - AAA server group for TACACS+
# - AAA authentication, authorization, and accounting
---
apiVersion: v1
kind: Secret
metadata:
  name: tacacs-server-keys
  namespace: default
type: Opaque
stringData:
  # Replace with your actual TACACS+ server shared secret
  server-key: "supersecretkey"
---
# Cisco NX-OS specific AAA configuration
# This configures vendor-specific settings like key encryption type,
# login error messages, console authentication, and config-commands authorization.
apiVersion: nx.cisco.networking.metal.ironcore.dev/v1alpha1
kind: AAAConfig
metadata:
  name: aaa-tacacs-nxos
  namespace: default
spec:
  keyEncryption: Type7
  loginErrorEnable: true
  consoleAuthentication:
    methods:
      - type: Group
        groupName: GR_TACACS
      - type: Local
  configCommandsAuthorization:
    methods:
      - type: Group
        groupName: GR_TACACS
      - type: Local
---
apiVersion: networking.metal.ironcore.dev/v1alpha1
kind: AAA
metadata:
  name: aaa-tacacs
  namespace: default
spec:
  # Reference to the Device this AAA configuration belongs to
  deviceRef:
    name: my-switch

  # Reference to the Cisco NX-OS specific AAA configuration
  providerConfigRef:
    group: nx.cisco.networking.metal.ironcore.dev
    kind: AAAConfig
    name: aaa-tacacs-nxos

  serverGroups:
    - name: GR_TACACS
      type: TACACS
      vrfName: management
      sourceInterfaceName: mgmt0
      servers:
        - address: "10.16.8.142"
          tacacs:
            keySecretRef:
              name: tacacs-server-keys
              key: server-key
        - address: "10.16.8.32"
          tacacs:
            keySecretRef:
              name: tacacs-server-keys
              key: server-key
        - address: "169.145.33.51"
          tacacs:
            keySecretRef:
              name: tacacs-server-keys
              key: server-key

  authentication:
    methods:
      - type: Group
        groupName: GR_TACACS

  authorization:
    methods:
      - type: Group
        groupName: GR_TACACS
      - type: Local

  accounting:
    methods:
      - type: Group
        groupName: GR_TACACS
