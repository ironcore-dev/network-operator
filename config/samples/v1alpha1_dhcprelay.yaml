    app.kubernetes.io/name: network-operator
    app.kubernetes.io/managed-by: kustomize
    networking.metal.ironcore.dev/device-name: leaf1
  name: vlan100
spec:
  deviceRef:
    name: leaf1
  id: 100
  name: DHCP-VLAN1
---
apiVersion: networking.metal.ironcore.dev/v1alpha1
kind: VLAN
metadata:
  labels:
    app.kubernetes.io/name: network-operator
    app.kubernetes.io/managed-by: kustomize
    networking.metal.ironcore.dev/device-name: leaf1
  name: vlan200
spec:
  deviceRef:
    name: leaf1
  id: 200
  name: DHCP-VLAN2
---
apiVersion: networking.metal.ironcore.dev/v1alpha1
kind: Interface
metadata:
  labels:
    app.kubernetes.io/name: network-operator
    app.kubernetes.io/managed-by: kustomize
    networking.metal.ironcore.dev/device-name: leaf1
  name: svi100
spec:
  deviceRef:
    name: leaf1
