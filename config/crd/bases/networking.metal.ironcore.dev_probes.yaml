                    description: Count is the number of ICMP echo requests to send.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  packetSize:
                    description: |-
                      PacketSize is the ICMP payload size in bytes.
                      Useful for detecting MTU issues in VXLAN overlays.
                    format: int32
                    maximum: 65507
                    minimum: 1
                    type: integer
                  sourceInterface:
                    description: |-
