metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: probes.networking.metal.ironcore.dev
spec:
  group: networking.metal.ironcore.dev
  names:
    kind: Probe
    listKind: ProbeList
    plural: probes
    shortNames:
