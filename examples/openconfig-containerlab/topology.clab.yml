name: nav-srl

topology:
  nodes:
    leaf1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.1
      startup-config: |-
        system name host-name srl
        system aaa authentication admin-user password admin
        system grpc-server mgmt yang-models openconfig
      ports:
        - 8022:22
        - 9339:57400
